name: flow-collect
on:
  workflow_dispatch:
  push:
    paths: ['scripts/collect_flow.py', '.github/workflows/flow.yml']
permissions:
  contents: write
concurrency: {group: flow, cancel-in-progress: true}
jobs:
  flow:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python scripts/collect_flow.py 2>&1 | tail -c 4000 | tee data/_log_flow.txt
        env: {PYTHONPATH: scripts, TEST: '1'}
        continue-on-error: true
      - name: commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: flow $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git pull --rebase -X ours origin main || true
          git push
