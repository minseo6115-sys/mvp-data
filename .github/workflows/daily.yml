name: daily-collect
on:
  schedule:
    - cron: '20 22 * * *'     # 매일 07:20 KST (전일 지표·밤사이 뉴스)
    - cron: '40 9 * * 1-5'    # 평일 18:40 KST (장 마감 후 공시·지수)
  workflow_dispatch:
  push:
    paths: ['scripts/collect_macro.py', 'scripts/collect_events.py', 'scripts/common.py', '.github/workflows/daily.yml']
permissions:
  contents: write
concurrency: {group: data-commit, cancel-in-progress: false}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: macro (ECOS, KDI EPU)
        run: python scripts/collect_macro.py 2>&1 | tail -c 4000 | tee data/_log_macro.txt
        env: {DART_API_KEY: '${{ secrets.DART_API_KEY }}', ECOS_API_KEY: '${{ secrets.ECOS_API_KEY }}', PYTHONPATH: scripts}
        continue-on-error: true
      - name: events (DART 공시, 뉴스)
        run: python scripts/collect_events.py 2>&1 | tail -c 4000 | tee data/_log_events.txt
        env: {DART_API_KEY: '${{ secrets.DART_API_KEY }}', ECOS_API_KEY: '${{ secrets.ECOS_API_KEY }}', PYTHONPATH: scripts}
        continue-on-error: true
      - name: commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: daily $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git pull --rebase -X theirs origin main || true
          git push
