name: probe-sources
on:
  workflow_dispatch:
  push:
    paths: ['scripts/probe.py', '.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: mkdir -p data/_probe && pip install pandas openpyxl pykrx > /dev/null
      - run: python scripts/probe.py 2>&1 | tail -c 20000 > data/_probe/run.log || true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          SECRET_NAMES_JSON: ${{ toJSON(secrets) }}
      - name: commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/_probe
          git commit -m "probe results" || echo "nothing"
          git push
